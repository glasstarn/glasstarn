[workspace]
resolver = "2"
members = [
    "crates/pm-core",
    "crates/pm-bench",
    "crates/pm-cli",
    "crates/pm-ingest",
    "crates/pm-mcp",
    "crates/pm-project",
    "crates/pm-query",
    "crates/pm-server",
    "crates/pm-testgen",
]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/glasstarn/glasstarn"
authors = ["Tropical Glacier LLC"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
