[package]
name = "pm-testgen"
description = "Generates event logs from known process models, providing ground truth for testing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true
authors.workspace = true

[dependencies]
# No `clock` feature: generated data must never depend on the current time.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
pm-core = { path = "../pm-core" }

[lints.rust]
unsafe_code = "forbid"
